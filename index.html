<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4i 人格图鉴 · 第四爱人格测试</title>
<style>
  :root{
    --bg:#f5f4f0;
    --card:#ffffff;
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --line:#e6e4de;
    --accent:#534AB7;
    --accent-soft:#EEEDFE;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px;}

  header{text-align:center;padding:28px 0 8px;}
  .logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 16px;letter-spacing:-1px;}
  header h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  header .sub{color:var(--muted);font-size:14px;margin-top:6px;}

  .progress{margin:24px 0 8px;}
  .progress .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress .fill{height:100%;background:var(--accent);transition:width .3s ease;}
  .progress .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}

  .card{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .q-label{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px;margin-bottom:14px;}
  .q-title{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:20px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:all .15s ease;background:#fff;}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft);}
  .opt:active{transform:scale(0.97);}
  .opt .key{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px;}
  .opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .opt.selected .key{background:var(--accent);border-color:var(--accent);color:#fff;}
  .opt .txt{font-size:15px;}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .btn{border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s ease;font-family:inherit;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{background:transparent;color:var(--muted);}

  /* 攻受选择 */
  .role-pick{display:flex;gap:12px;margin-bottom:24px;}
  .role-card{flex:1;border:2px solid var(--line);border-radius:16px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .15s ease;background:#fff;}
  .role-card:hover{border-color:var(--accent);}
  .role-card.selected{border-color:var(--accent);background:var(--accent-soft);}
  .role-card .rk-icon{font-size:26px;margin-bottom:8px;}
  .role-card .rk-name{font-size:17px;font-weight:700;}
  .role-card .rk-desc{font-size:12px;color:var(--muted);margin-top:4px;}

  /* 结果页 */
  .result{padding:0;}
  .res-hero{color:#fff;padding:36px 28px 30px;border-radius:20px 20px 0 0;text-align:center;}
  .res-hero .avatar{width:96px;height:96px;border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid rgba(255,255,255,.5);box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden;}
  .res-hero .avatar img{width:100%;height:100%;object-fit:cover;}
  .res-hero .code{font-size:38px;font-weight:800;letter-spacing:3px;}
  .res-hero .code span{opacity:.6;font-weight:400;}
  .res-name{font-size:24px;font-weight:700;margin-top:10px;}
  .res-name .role{font-size:13px;font-weight:400;opacity:.75;margin-right:6px;}
  .res-persona{font-size:14px;opacity:.9;margin-top:6px;}
  .res-sub{font-size:12px;opacity:.75;margin-top:6px;}
  .res-body{padding:26px 28px 30px;}

  .dim-list{display:flex;flex-direction:column;gap:16px;margin-bottom:26px;}
  .dim .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .dim .row b{font-weight:600;}
  .dim .track{height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden;}
  .dim .track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#d8d5cc;}
  .dim .track .fill{position:absolute;top:0;bottom:0;border-radius:4px;}
  .dim .track .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);}

  .sec-title{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-title::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px;}
  .desc{padding:16px;background:var(--accent-soft);border-radius:14px;font-size:14px;margin-bottom:10px;}
  .desc.alt{background:#faf9f6;border:1px solid var(--line);}
  .tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:99px;}

  .actions{display:flex;gap:10px;margin-top:26px;}
  .actions .btn{flex:1;}

  .footer-credit{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--muted);}
  .x-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;background:#000;border-radius:6px;color:#fff;}
  .x-icon svg{width:11px;height:11px;}
  .footnote{text-align:center;font-size:12px;color:var(--muted);margin-top:12px;}
  .hidden{display:none!important;}

  /* ===== 首页丰富内容 ===== */
  .home-dims{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);}
  .home-dims-title{font-size:14px;font-weight:700;text-align:center;margin-bottom:14px;color:var(--ink);}
  .home-dims-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hd-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;background:#faf9f6;}
  .hd-item b{font-size:18px;font-weight:800;color:var(--accent);}
  .hd-item span{font-size:11px;color:var(--muted);}

  .home-types{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);}
  .home-types-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .ht-cell{padding:10px 4px;border-radius:10px;text-align:center;font-size:11px;font-weight:700;color:#fff;cursor:default;transition:transform .12s ease;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .ht-cell:hover{transform:translateY(-2px);}
  .ht-cell .ht-code{font-size:11px;letter-spacing:.5px;opacity:.95;}
  .ht-cell .ht-name{font-size:9px;font-weight:400;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 音乐按钮 */
  .music-btn{position:fixed;top:14px;right:14px;z-index:998;width:40px;height:40px;border-radius:50%;border:none;background:var(--card);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .15s ease;}
  .music-btn:hover{transform:scale(1.1);}
  .music-btn.playing{animation:musicSpin 3s linear infinite;}
  @keyframes musicSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* 分享图预览弹窗 */
  .share-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  .share-modal .modal-box{background:#fff;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .share-modal .modal-box img{width:100%;border-radius:12px;display:block;}
  .share-modal .modal-tip{text-align:center;font-size:13px;color:#8a8a8a;margin-top:12px;}
  .share-modal .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .share-modal .modal-actions .btn{flex:1;}

  /* ===== 响应式适配：手机 / 平板 / 桌面 ===== */

  /* 平板 & 桌面：稍宽留白更舒展 */
  @media (min-width: 768px){
    .wrap{max-width:680px;padding:44px 28px 80px;}
    header h1{font-size:30px;}
    .card{padding:34px;}
    .q-title{font-size:21px;}
    .opt{padding:16px 18px;}
    .opt .txt{font-size:16px;}
    .res-hero .avatar{width:112px;height:112px;}
    .res-name{font-size:26px;}
    .res-hero .code{font-size:44px;}
  }

  /* 大屏：整体居中更开阔 */
  @media (min-width: 1024px){
    .wrap{max-width:720px;}
  }

  /* 手机：紧凑布局，放大触控区域 */
  @media (max-width: 480px){
    .wrap{padding:20px 14px 48px;}
    header{padding:16px 0 4px;}
    .logo{width:48px;height:48px;border-radius:14px;font-size:19px;}
    header h1{font-size:22px;}
    header .sub{font-size:13px;}
    .progress{margin:18px 0 6px;}
    .card{padding:20px 16px;border-radius:16px;}
    .q-label{font-size:11px;}
    .q-title{font-size:17px;margin-bottom:16px;}
    .opt{padding:12px 14px;gap:10px;border-radius:12px;}
    .opt .key{width:22px;height:22px;font-size:11px;}
    .opt .txt{font-size:14px;}
    .btn{padding:12px 18px;font-size:14px;}
    .role-pick{gap:10px;}
    .role-card{padding:16px 8px;}
    .role-card .rk-name{font-size:15px;}
    .res-hero{padding:28px 20px 24px;}
    .res-hero .avatar{width:84px;height:84px;border-radius:18px;}
    .res-hero .code{font-size:30px;letter-spacing:2px;}
    .res-name{font-size:21px;}
    .res-persona{font-size:13px;}
    .res-body{padding:20px 16px 24px;}
    .desc{font-size:13px;}
    .actions{flex-direction:column;}
    .footer-credit{flex-wrap:wrap;font-size:11px;}
  }
</style>
</head>
<body>
<button class="music-btn" id="music-btn" onclick="toggleMusic()" title="背景音乐">🔇</button>
<div class="wrap">
  <header>
    <div class="logo">4i</div>
    <h1>4i 人格图鉴</h1>
    <div class="sub">第四爱人格测试 · 32 题 · 16 种人格</div>
  </header>

  <!-- 开始页 -->
  <div id="screen-start" class="card">
    <p style="font-size:15px;color:var(--muted);text-align:center;margin-bottom:4px;">关于你在关系中的角色与主导方式</p>
    <p style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px;">32 道题 · 约 3 分钟 · 娱乐之作</p>

    <div class="q-label" style="display:block;text-align:center;margin:0 0 12px;">先告诉我，你更偏向哪一方？</div>
    <div class="role-pick">
      <div class="role-card" id="role-attack" onclick="pickRole('attack')">
        <div class="rk-icon">👑</div>
        <div class="rk-name">攻方</div>
        <div class="rk-desc">主导、掌控、主动的一方</div>
      </div>
      <div class="role-card" id="role-receive" onclick="pickRole('receive')">
        <div class="rk-icon">🌙</div>
        <div class="rk-name">受方</div>
        <div class="rk-desc">顺从、被引导、被宠的一方</div>
      </div>
    </div>

    <button class="btn primary" style="width:100%;" id="btn-start" onclick="start()" disabled>开始测试</button>

    <!-- 首页丰富：维度说明 -->
    <div class="home-dims">
      <div class="home-dims-title">四个维度，拼出你的 4i 人格</div>
      <div class="home-dims-grid">
        <div class="hd-item"><b>L</b> 落点层面<span>精神 ↔ 生理</span></div>
        <div class="hd-item"><b>A</b> 主导气质<span>霸道 ↔ 温柔</span></div>
        <div class="hd-item"><b>F</b> 角色稳定<span>固定 ↔ 互攻</span></div>
        <div class="hd-item"><b>E</b> 表达方式<span>进攻 ↔ 引诱</span></div>
      </div>
    </div>

    <!-- 首页丰富：16 型预览 -->
    <div class="home-types">
      <div class="home-dims-title">16 型人格 · 攻受双面</div>
      <div class="home-types-grid" id="home-types-grid"></div>
    </div>
  </div>

  <!-- 答题页 -->
  <div id="screen-quiz" class="hidden">
    <div class="progress">
      <div class="bar"><div class="fill" id="bar"></div></div>
      <div class="meta"><span id="dim-hint"></span><span id="count"></span></div>
    </div>
    <div class="card">
      <div class="q-label" id="q-label"></div>
      <div class="q-title" id="q-title"></div>
      <div class="options" id="options"></div>
      <div class="nav">
        <button class="btn ghost" id="btn-prev" onclick="prev()">上一题</button>
        <button class="btn primary" id="btn-next" onclick="next()">下一题</button>
      </div>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="screen-result" class="card result hidden">
    <div class="res-hero" id="res-hero">
      <div class="avatar" id="res-avatar"></div>
      <div class="code" id="res-code"></div>
      <div class="res-name"><span class="role" id="res-role"></span><span id="res-name"></span></div>
      <div class="res-persona" id="res-persona"></div>
      <div class="res-sub" id="res-sub"></div>
    </div>
    <div class="res-body">
      <div class="tag-row" id="res-tags"></div>
      <div class="dim-list" id="res-dims"></div>

      <div class="sec-title" id="res-desc-title">关于你</div>
      <div class="desc" id="res-desc"></div>

      <div class="sec-title">相处建议</div>
      <div class="desc alt" id="res-advice"></div>

      <div class="actions">
        <button class="btn ghost" onclick="restart()">重新测试</button>
        <button class="btn primary" onclick="saveShareCard()">保存分享图</button>
      </div>
      <div class="actions" style="margin-top:10px;">
        <button class="btn ghost" style="flex:none;margin:0 auto;" onclick="previewShareCard()">预览分享图</button>
      </div>
    </div>
  </div>

  <div class="footer-credit">
    <span>设计者：</span>
    <span class="x-icon" title="X">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93Zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41Z"/></svg>
    </span>
    <span>小妈不是妈 @eryiwanwan</span>
  </div>
  <div class="footnote">仅供娱乐 · 结果不构成任何关系或心理建议</div>
</div>

<!-- 分享图预览弹窗 -->
<div id="share-modal" class="share-modal hidden">
  <div class="modal-box">
    <img id="share-modal-img" alt="分享图预览">
    <div class="modal-tip">长按上方图片即可保存到相册</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeShareModal()">关闭</button>
      <button class="btn primary" onclick="saveShareCard()">保存到相册</button>
    </div>
  </div>
</div>

<script>

const QUESTIONS = [
  // ===== L 维度：落点层面（精神 S ↔ 生理 P）=====
  {d:"L",
   t:"你设想一段让你心动的「四爱关系」时，脑子里最先蹦出来的画面更接近？",
   o:["我把对方宠成宝宝，生活里事事我做主、他依赖我","关系里气场和决定权都在我这边，他心甘情愿听话","除了生活上我做主，在床上我也想压他一头","我想在身体上彻底主导他，让他臣服、求饶"],
   tR:"你设想一段让你心动的「四爱关系」时，脑子里最先蹦出来的画面更接近？",
   oR:["我被她宠成宝宝，生活里事事她做主、我依赖她","关系里气场和决定权都在她那边，我甘愿听话","除了生活上她做主，在床上我也愿意被她压一头","我想在身体上被她彻底主导，心甘情愿臣服、求饶"]},
  {d:"L",
   t:"如果「四爱关系」里只能保留一样，你更舍不得哪一样？",
   o:["情感上被需要、被依赖的感觉","日常相处里我拿主意、他乖乖跟随的模式","亲密时刻里我占据主动、他配合的默契","身体上那种「我是攻」的实感"],
   tR:"如果「四爱关系」里只能保留一样，你更舍不得哪一样？",
   oR:["情感上需要她、依赖她的感觉","日常相处里她拿主意、我乖乖跟随的模式","亲密时刻里她占据主动、我配合的默契","身体上那种「我是受」的实感"]},
  {d:"L",
   t:"你对「精神四爱」和「纯四爱」的站队更接近？",
   o:["精神四爱就很好，床上怎么着无所谓","我偏精神，但偶尔也馋一下身体反转","我偏生理，精神反转是基础但不够","纯四爱，没有 pegging 那味儿就不算完整"],
   tR:"你对「精神四爱」和「纯四爱」的站队更接近？",
   oR:["精神四爱就很好，床上怎么着无所谓","我偏精神，但偶尔也馋一下身体被反转","我偏生理，精神上被主导是基础但不够","纯四爱，没有被 pegging 那味儿就不算完整"]},
  {d:"L",
   t:"一段关系里，最能让你「上头」的时刻是？",
   o:["他红着脸叫我「主人」（之类称呼）的那一刻","他在人前不自觉依赖我、事事问我的时候","他在我怀里软成一滩、任我摆布的时候","他彻底放开、把自己交给我支配的时候"],
   tR:"一段关系里，最能让你「上头」的时刻是？",
   oR:["我红着脸叫她「主人」（之类称呼）的那一刻","我在人前不自觉依赖她、事事问她的时候","我在她怀里软成一滩、任她摆布的时候","我彻底放开、把自己交给她支配的时候"]},
  {d:"L",
   t:"你更享受哪一种「反转」带来的快感？",
   o:["精神上的征服——他心甘情愿臣服于我的气场","角色上的反转——颠覆传统关系角色","亲密里的主动权——我来决定节奏和方式","身体上的主导——道具、姿势、位置都由我定"],
   tR:"你更享受哪一种「反转」带来的快感？",
   oR:["精神上的臣服——我甘愿臣服于她的气场","角色上的反转——颠覆传统关系角色","亲密里的被主导感——由她来决定节奏和方式","身体上的被主导——道具、姿势、位置都由她定"]},
  {d:"L",
   t:"如果对方坚决不接受任何身体上的反转，你的反应更接近？",
   o:["完全无所谓，精神上能反转就够了","有点遗憾，但也不是不能接受","会认真考虑这段关系还要不要继续","直接劝退，这就是硬性条件"],
   tR:"如果对方坚决不跟你做任何身体上的反转，你的反应更接近？",
   oR:["完全无所谓，精神上被她主导就够了","有点遗憾，但也不是不能接受","会认真考虑这段关系还要不要继续","直接劝退，这就是硬性条件"]},
  {d:"L",
   t:"「Pegging」这个词在你心里的分量更接近？",
   o:["听过，但对我来说可有可无","偶尔会幻想，但不强求","挺重要的，是关系里期待的环节","核心需求，我奔着这个来的"],
   tR:"「被 Pegging」这件事在你心里的分量更接近？",

/* ============ 背景音乐（Web Audio 合成舒缓环境音） ============ */
let audioCtx = null;
let musicNodes = null;
let musicPlaying = false;

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();

  // 主增益
  const master = audioCtx.createGain();
  master.gain.value = 0.0;
  master.connect(audioCtx.destination);

  // 铺底和弦垫（柔和三和弦循环）
  const padGain = audioCtx.createGain();
  padGain.gain.value = 0.16;
  padGain.connect(master);

  // 用低频振荡器+滤波做一个持续的音垫
  const chords = [
    [261.63, 329.63, 392.00], // C
    [220.00, 261.63, 329.63], // Am
    [196.00, 246.94, 293.66], // G
    [174.61, 220.00, 261.63], // F
  ];
  const oscs = [];
  chords.forEach((freqs, ci) => {
    freqs.forEach(f => {
      const o = audioCtx.createOscillator();
      o.type = "sine";
      o.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.value = 0;
      // 每个和弦淡入淡出
      const start = audioCtx.currentTime + ci * 4;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.05, start + 1.5);
      g.gain.setValueAtTime(0.05, start + 3.5);
      g.gain.linearRampToValueAtTime(0, start + 5);
      o.connect(g);
      g.connect(padGain);
      o.start(start);
      o.stop(start + 5);
      oscs.push(o);
    });
  });

  // 循环和弦：每 16 秒重来一轮
  function schedulePad(){
    const base = audioCtx.currentTime;
    chords.forEach((freqs, ci) => {
      freqs.forEach(f => {
        const o = audioCtx.createOscillator();
        o.type = "sine";
        o.frequency.value = f;
        const g = audioCtx.createGain();
        const st = base + ci * 4;
        g.gain.setValueAtTime(0, st);
        g.gain.linearRampToValueAtTime(0.04, st + 1.5);
        g.gain.setValueAtTime(0.04, st + 3.5);
        g.gain.linearRampToValueAtTime(0, st + 5);
        o.connect(g); g.connect(padGain);
        o.start(st); o.stop(st + 5);
      });
    });
  }

  // 柔和的高音铃（点缀）
  const bellGain = audioCtx.createGain();
  bellGain.gain.value = 0.05;
  bellGain.connect(master);
  function scheduleBell(){
    const notes = [523.25, 659.25, 783.99, 659.25];
    const st = audioCtx.currentTime;
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      o.type = "sine";
      o.frequency.value = f;
      const g = audioCtx.createGain();
      const t = st + i * 4 + 2;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.3);
      g.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
      o.connect(g); g.connect(bellGain);
      o.start(t); o.stop(t + 2.5);
    });
  }

  // 定时调度
  let padTimer = setInterval(schedulePad, 16000);
  let bellTimer = setInterval(scheduleBell, 16000);
  schedulePad();
  scheduleBell();

  musicNodes = { master, padGain, bellGain, timers:[padTimer, bellTimer] };
}

function toggleMusic(){
  const btn = document.getElementById("music-btn");
  initAudio();
  if(!audioCtx){ return; }
  if(audioCtx.state === "suspended"){ audioCtx.resume(); }
  if(musicPlaying){
    // 停止：淡出
    musicNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
    musicNodes.master.gain.setValueAtTime(musicNodes.master.gain.value, audioCtx.currentTime);
    musicNodes.master.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
    btn.textContent = "🔇";
    btn.classList.remove("playing");
    musicPlaying = false;
  } else {
    // 播放：淡入
    musicNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
    musicNodes.master.gain.setValueAtTime(musicNodes.master.gain.value, audioCtx.currentTime);
    musicNodes.master.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 1.2);
    btn.textContent = "🎵";
    btn.classList.add("playing");
    musicPlaying = true;
  }
}

/* ============ 点击音效 ============ */
function playClick(){
  if(!audioCtx){ return; }
  if(audioCtx.state === "suspended"){ audioCtx.resume(); }
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(660, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.13);
}

function pickRole(r){

function start(){

  $("screen-result").classList.add("hidden");
  $("screen-quiz").classList.remove("hidden");

function render(){
  const q = QUESTIONS[idx];
  const dimKey = q.d;
  const dimLabel = DIMS[dimKey];
  const isAttack = role === "attack";
  const title = isAttack ? q.t : (q.tR || q.t);
  const options = isAttack ? q.o : (q.oR || q.o);
  $("q-label").textContent = "维度 " + dimKey + " · " + dimLabel.a + " / " + dimLabel.b;
  $("q-title").textContent = title;
  $("dim-hint").textContent = "第 " + (idx+1) + " / " + QUESTIONS.length + " 题";
  $("count").textContent = "维度 " + dimKey;
  $("bar").style.width = ((idx) / QUESTIONS.length * 100) + "%";

  const optBox = $("options");
  optBox.innerHTML = "";
  options.forEach((txt, i) => {
    const div = document.createElement("div");
    div.className = "opt";
    if (answers[idx] === i) div.classList.add("selected");
    const key = document.createElement("div");
    key.className = "key";
    key.textContent = String.fromCharCode(65 + i);
    const span = document.createElement("span");
    span.className = "txt";
    span.textContent = txt;
    div.appendChild(key);
    div.appendChild(span);
    div.onclick = () => {
      // 点击感：缩放动画 + 音效
      playClick();
      div.style.transform = "scale(0.97)";
      setTimeout(() => { div.style.transform = ""; }, 120);
      answers[idx] = i;
      render();
    };
    optBox.appendChild(div);
  });

  $("btn-prev").disabled = idx === 0;
  $("btn-next").textContent = idx === QUESTIONS.length - 1 ? "查看结果" : "下一题";
  $("btn-next").disabled = answers[idx] === null;
}

function prev(){ if(idx > 0){ idx--; render(); } }
function next(){
  if(answers[idx] === null) return;
  if(idx < QUESTIONS.length - 1){ idx++; render(); }
  else{ showResult(); }
}

function showResult(){
  const scores = {L:0,A:0,F:0,E:0};
  QUESTIONS.forEach((q, i) => {
    const a = answers[i];
    if(a === null) return;
    scores[q.d] += [ -2, -1, 1, 2 ][a];
  });
  const L = scores.L < 0 ? "S" : "P";
  const A = scores.A < 0 ? "D" : "T";
  const F = scores.F < 0 ? "F" : "M";
  const E = scores.E < 0 ? "A" : "L";
  const typeKey = L+"-"+A+"-"+F+"-"+E;
  const t = TYPES[typeKey];
  const isAttack = role === "attack";

  // 结果只显示对应一方
  const displayName = isAttack ? t.attack : t.receive;
  const displayDesc = isAttack ? t.attackDesc : t.receiveDesc;
  const roleLabel = isAttack ? "攻方" : "受方";

  $("res-code").innerHTML = [L,A,F,E].map(c=>`<span>${c}</span>`).join("");
  $("res-role").textContent = roleLabel;
  $("res-name").textContent = displayName;
  $("res-persona").textContent = "「" + t.persona + "」";
  $("res-sub").textContent = LETTER_NAMES[L] + " × " + LETTER_NAMES[A] + " × " + LETTER_NAMES[F] + " × " + LETTER_NAMES[E];

  // 标签配色跟随主色
  document.documentElement.style.setProperty("--accent", t.c);
  document.documentElement.style.setProperty("--accent-soft", t.c + "1A");
  $("res-tags").innerHTML = t.tags.map(x => `<span class="tag">${x}</span>`).join("");

  // 四维强度条
  $("res-dims").innerHTML = DIM_META.map(m => {
    const s = scores[m.key];
    const pct = Math.max(0, Math.min(100, (s + 16) / 32 * 100));
    const dirLabel = s < 0 ? m.pos0 : m.pos1;
    const abs = Math.abs(s);
    return `<div class="dim">
      <div class="row"><span>${m.key} · ${m.pos0} / ${m.pos1}</span><b>${dirLabel} ${abs>=8?'（强）':abs>=3?'（中）':'（弱）'}</b></div>
      <div class="track"><div class="mid"></div><div class="fill" style="left:${pct<50?pct:50}%;right:${pct>=50?(100-pct):50}%;background:${t.c};"></div><div class="dot" style="left:${pct}%;border-color:${t.c};"></div></div>
    </div>`;
  }).join("");

  $("res-desc-title").textContent = "关于你（" + roleLabel + "）";
  $("res-desc").textContent = displayDesc;
  $("res-advice").textContent = t.advice;

  window.__resultCode = typeKey;
  window.__resultName = displayName;

  $("screen-result").classList.remove("hidden");

}

/* ============ 分享图生成（Canvas 渲染长图） ============ */

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const chars = Array.from(text);
  let line = "";
  let lines = [];
  const noStart = '，。、；：！？）》」』"\'';
  for(let i=0;i<chars.length;i++){
    const c = chars[i];
    const test = line + c;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = c;
      if(lines.length >= maxLines) break;
    } else {
      line = test;
    }
  }
  if(line && lines.length < maxLines) lines.push(line);
  // 行首禁则标点处理
  for(let i=1;i<lines.length;i++){
    if(lines[i] && noStart.includes(lines[i][0])){
      const prev = lines[i-1];
      const moved = prev[prev.length-1];
      lines[i-1] = prev.slice(0,-1);
      lines[i] = moved + lines[i];
    }
  }
  return lines;
}

      const adviceH = adviceLines.length * 30 + 24;
      const qrH = 160;
      const footerH = 60;
      const totalH = heroH + tagsH + dimsH + descTitleH + descH + adviceTitleH + adviceH + qrH + footerH + 40;

      canvas.width = W * dpr;
      canvas.height = Math.ceil(totalH * dpr);
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.textBaseline = "alphabetic";

      // 背景
      ctx.fillStyle = "#f5f4f0";
      ctx.fillRect(0, 0, W, totalH);

      // ===== 顶部英雄区 =====

      roundRect(ctx, pad, pad, W - pad*2, heroH, 24);
      ctx.fill();

      // 头像（白底圆角，垂直居中于英雄区）

        roundRect(ctx, ax, ay, avatarSize, avatarSize, 22);
        ctx.clip();
        ctx.drawImage(avatarImg, ax, ay, avatarSize, avatarSize);
        ctx.restore();
      }

      const tx = ax + avatarSize + 28;
      let ty = ay + 8;

      ctx.fillText(roleLabel, tx, ty);
      ty += 40;

      ctx.font = "700 30px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText(displayName, tx, ty);

      // 定位语
      ty += 38;
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.font = "400 16px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("「" + t.persona + "」", tx, ty);

      let curY = pad + heroH + 20;

      // ===== 标签 =====
      let tagX = pad;
      ctx.font = "500 15px -apple-system, 'PingFang SC', sans-serif";
      t.tags.forEach(tag => {
        ctx.fillStyle = accent + "1A";
        ctx.font = "500 15px -apple-system, 'PingFang SC', sans-serif";
        const tw = ctx.measureText(tag).width + 28;
        roundRect(ctx, tagX, curY, tw, 34, 17);
        ctx.fill();
        ctx.fillStyle = accent;
        ctx.fillText(tag, tagX + 14, curY + 22);
        tagX += tw + 10;
      });
      curY += 34 + 24;

      // ===== 四维强度条 =====
      const scores = window.__resultScores || {L:0,A:0,F:0,E:0};
      const dims = DIM_META.map(m => {
        const s = scores[m.key];
        const pct = Math.max(0, Math.min(100, (s + 16) / 32 * 100));
        const dirLabel = s < 0 ? m.pos0 : m.pos1;
        const abs = Math.abs(s);
        const strength = abs>=8?'（强）':abs>=3?'（中）':'（弱）';
        return {key:m.key, pos0:m.pos0, pos1:m.pos1, pct, dirLabel, strength};
      });
      dims.forEach(d => {
        // 标签行
        ctx.fillStyle = "#6b6b6b";
        ctx.font = "500 15px -apple-system, 'PingFang SC', sans-serif";
        ctx.fillText(d.key + " · " + d.pos0 + " / " + d.pos1, pad, curY + 16);
        ctx.textAlign = "right";
        ctx.fillStyle = "#1a1a1a";
        ctx.font = "700 15px -apple-system, 'PingFang SC', sans-serif";
        ctx.fillText(d.dirLabel + d.strength, W - pad, curY + 16);
        ctx.textAlign = "left";
        curY += 24;

        // 轨道
        const trackY = curY + 4;
        ctx.fillStyle = "#e6e4de";
        roundRect(ctx, pad, trackY, W - pad*2, 10, 5);
        ctx.fill();
        // 填充
        const fillW = (W - pad*2) * d.pct / 100;
        ctx.fillStyle = accent;
        if(d.pct < 50){
          roundRect(ctx, pad + (W-pad*2)*d.pct/100, trackY, (W-pad*2)*(50-d.pct)/100, 10, 5);
          ctx.fill();
        } else {
          roundRect(ctx, pad + (W-pad*2)*0.5, trackY, (W-pad*2)*(d.pct-50)/100, 10, 5);
          ctx.fill();
        }
        // 圆点
        const dotX = pad + (W-pad*2)*d.pct/100;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(dotX, trackY+5, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.stroke();
        curY += 26;
      });
      curY += 12;

      // ===== 关于你 =====
      ctx.fillStyle = accent;
      roundRect(ctx, pad, curY-6, 4, 20, 2);
      ctx.fill();
      ctx.fillStyle = "#1a1a1a";
      ctx.font = "700 18px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("关于你（" + roleLabel + "）", pad + 14, curY + 8);
      curY += 26;

      // 描述卡片
      ctx.fillStyle = accent + "14";
      roundRect(ctx, pad, curY, W - pad*2, descLines.length*34 + 24, 16);
      ctx.fill();
      ctx.fillStyle = "#333";
      ctx.font = "400 16px -apple-system, 'PingFang SC', sans-serif";
      descLines.forEach((ln, i) => {
        ctx.fillText(ln, pad + 18, curY + 30 + i*34);
      });
      curY += descLines.length*34 + 24 + 16;

      // ===== 相处建议 =====
      ctx.fillStyle = accent;
      roundRect(ctx, pad, curY-6, 4, 20, 2);
      ctx.fill();
      ctx.fillStyle = "#1a1a1a";
      ctx.font = "700 18px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("相处建议", pad + 14, curY + 8);
      curY += 26;

      ctx.fillStyle = "#faf9f6";
      ctx.strokeStyle = "#e6e4de";
      ctx.lineWidth = 1;
      roundRect(ctx, pad, curY, W - pad*2, adviceLines.length*30 + 24, 16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#444";
      ctx.font = "400 15px -apple-system, 'PingFang SC', sans-serif";
      adviceLines.forEach((ln, i) => {
        ctx.fillText(ln, pad + 18, curY + 28 + i*30);
      });
      curY += adviceLines.length*30 + 24;

      // ===== 二维码区域 =====
      curY += 16;
      const qrCardY = curY;
      const qrCardH = 140;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#e6e4de";
      ctx.lineWidth = 1;
      roundRect(ctx, pad, qrCardY, W - pad*2, qrCardH, 16);
      ctx.fill();
      ctx.stroke();

      const qrReady = qrImg;
      if(qrReady && qrReady.width){
        const qrSize = 104;
        const qrX = pad + 24;
        const qrY = qrCardY + (qrCardH - qrSize) / 2;
        ctx.save();
        roundRect(ctx, qrX - 6, qrY - 6, qrSize + 12, qrSize + 12, 8);
        ctx.clip();
        ctx.fillStyle = "#fff";
        ctx.fillRect(qrX - 6, qrY - 6, qrSize + 12, qrSize + 12);
        ctx.drawImage(qrReady, qrX, qrY, qrSize, qrSize);
        ctx.restore();
      }

      const qrTextX = pad + 24 + 116 + 20;
      ctx.textAlign = "left";
      ctx.fillStyle = "#1a1a1a";
      ctx.font = "700 20px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("扫码测一测", qrTextX, qrCardY + 46);
      ctx.fillStyle = "#6b6b6b";
      ctx.font = "400 14px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("长按识别二维码", qrTextX, qrCardY + 74);
      ctx.fillStyle = "#9a9a9a";
      ctx.font = "400 13px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("测出你的 4i 人格类型", qrTextX, qrCardY + 98);
      ctx.textAlign = "left";

      curY += qrCardH + 16;

      // ===== 底部署名 =====
      curY += 14;
      ctx.textAlign = "center";
      ctx.fillStyle = "#6b6b6b";
      ctx.font = "400 14px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("4i 人格图鉴 · 设计者：小妈不是妈 @eryiwanwan", W/2, curY);
      curY += 22;
      ctx.fillStyle = "#9a9a9a";
      ctx.font = "400 12px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText("仅供娱乐 · 结果不构成任何关系或心理建议", W/2, curY);
      ctx.textAlign = "left";

      resolve(canvas);
    }
  });
}

function downloadShareCard(){
  buildShareCard().then(canvas => {
    const a = document.createElement("a");
    a.download = "4i人格图鉴_" + (window.__resultCode||"") + "_" + (window.__resultName||"") + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
}

// 「保存分享图」统一入口：优先走系统分享（可存相册），兜底走下载
function saveShareCard(){
  buildShareCard().then(canvas => {
    canvas.toBlob(blob => {
      if(!blob) { downloadShareCard(); return; }
      const file = new File([blob], "4i人格图鉴_" + (window.__resultCode||"") + ".png", {type:"image/png"});
      // 支持 Web Share API Level 2（可分享文件到相册/微信/其他应用）
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:"4i 人格图鉴"}).catch(()=>{ downloadShareCard(); });
      } else if(navigator.share){
        // 仅支持文本分享的环境（如部分 iOS），走下载
        downloadShareCard();
      } else {
        downloadShareCard();
      }
    }, "image/png");
  });
}

function previewShareCard(){
  buildShareCard().then(canvas => {
    const img = document.getElementById("share-modal-img");
    img.src = canvas.toDataURL("image/png");
    document.getElementById("share-modal").classList.remove("hidden");
  });
}

function closeShareModal(){
  document.getElementById("share-modal").classList.add("hidden");
}

// 点击弹窗背景关闭
document.addEventListener("DOMContentLoaded", function(){
  renderHomeTypes();
  const modal = document.getElementById("share-modal");
  modal.addEventListener("click", function(e){
    if(e.target === modal) closeShareModal();
  });
});
</script>
